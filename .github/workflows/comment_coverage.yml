name: Comment coverage

on:
  workflow_run:
    workflows: [Tests]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    name: Comment coverage
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Find associated pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ github.event.workflow_run.pull_requests[0].number == null }}
        with:
          script: |
            const response = await github.rest.pulls.list({
              owner: "${{ github.repository_owner }}",
              repo: context.payload.workflow_run.repository.name,
              state: "open",
              head: `${context.payload.workflow_run.head_repository.owner.login}:${context.payload.workflow_run.head_branch}`,
            });

            return response.data[0]?.number ?? "";
          retries: 3
      - name: Comment coverage
        uses: MishaKav/pytest-coverage-comment@ce64cfb4332195faa36733a0364dda8849109f70
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: coverage-junit.xml
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number || steps.pr.outputs.result }}
          report-only-changed-files: true
